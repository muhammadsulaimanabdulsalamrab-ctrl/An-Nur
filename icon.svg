<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#c96442"/>
  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2.5"/>
  <!-- 8-pointed star (Islamic geometric) -->
  <polygon points="256,68 276,144 348,116 320,188 396,208 324,240 352,316 280,288 256,364 232,288 160,316 188,240 116,208 192,188 164,116 236,144" fill="rgba(255,255,255,0.1)"/>
  <!-- Arabic letter Nun (ن) — symbol of An-Nur -->
  <text x="256" y="330" text-anchor="middle" font-family="'Amiri Quran', 'Amiri', Georgia, serif" font-size="288" fill="white" opacity="0.95">ن</text>
</svg>
